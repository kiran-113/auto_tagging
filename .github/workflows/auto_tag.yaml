name: Tag Release on Changes in module

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check changes in module directory
        id: changes-check
        run: |
          # Fetch the previous commit on main branch
          git fetch origin main --depth=2
          # Get the most recent two commits to compare
          PREV_COMMIT=$(git rev-parse HEAD^)
          CURR_COMMIT=$(git rev-parse HEAD)
          # Check the difference in the module directory
          if git diff --quiet $PREV_COMMIT $CURR_COMMIT -- module; then
            echo "module_changed=false" >> $GITHUB_ENV
          else
            echo "module_changed=true" >> $GITHUB_ENV
          fi

      - name: Calculate new tag versions
        id: calc-tag
        if: env.module_changed == 'true'
        run: |
          # Fetch all tags
          git fetch --tags

          # Get the latest tag from the repository (for normal tags)
          latestTag=$(git tag --list "v[0-9].[0-9].[0-9]" | sort -V | tail -n 1)

          # Default to v1.2.1 if no tag exists for regular tags
          if [ -z "$latestTag" ]; then
            new_tag="v1.2.1"
          else
            # Extract the main, minor, and patch version numbers
            latestVersion=${latestTag#v}
            main=${latestVersion%%.*}
            minor=${latestVersion#*.}
            minor=${minor%.*}
            patch=${latestVersion##*.}

            if [ "$patch" -lt 99 ]; then
              patch=$((patch + 1))
            else
              patch=0
              minor=$((minor + 1))
            fi

            new_tag="v$main.$minor.$patch"
          fi

          echo "new_tag=$new_tag" >> $GITHUB_ENV

          # Get the latest -prod tag
          latestProdTag=$(git tag --list "v[0-9].[0-9].[0-9]-prod" | sort -V | tail -n 1)

          # Default to v1.1.1-prod if no -prod tag exists
          if [ -z "$latestProdTag" ]; then
            new_prod_tag="v1.1.1-prod"
          else
            # Extract the main, minor, and patch version numbers for the prod tag
            prodVersion=${latestProdTag%-prod}
            prodVersion=${prodVersion#v}
            main=${prodVersion%%.*}
            minor=${prodVersion#*.}
            minor=${minor%.*}
            patch=${prodVersion##*.}

            if [ "$patch" -lt 99 ]; then
              patch=$((patch + 1))
            else
              patch=0
              minor=$((minor + 1))
            fi

            new_prod_tag="v$main.$minor.$patch-prod"
          fi

          echo "new_prod_tag=$new_prod_tag" >> $GITHUB_ENV

      - name: Create the new tags
        if: env.module_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create and push both tags
          git tag ${{ env.new_tag }}
          git tag ${{ env.new_prod_tag }}
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git ${{ env.new_tag }}
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git ${{ env.new_prod_tag }}
